services:
  comedor-rh:
    build:
      context: .
    image: comedor-rh:local
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      SESSION_SECURE_COOKIE: "true"
    expose:
      - "80"
    volumes:
      - comedor-storage:/var/www/html/storage
    networks:
      - hla-database

volumes:
  comedor-storage:

networks:
  hla-database:
    external: true
    name: "${HLA_DOCKER_NETWORK:?Set HLA_DOCKER_NETWORK to the Laradock MySQL network}"
